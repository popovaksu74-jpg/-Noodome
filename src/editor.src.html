<script>
(function(){
"use strict";
var NDL=window.NDL,esc=NDL.esc,TYPES=NDL.TYPES,SHARED=NDL.SHARED;
var LANDING_SRC=document.getElementById("ndl-src").textContent;

var CLUB_SEED=JSON.parse(document.getElementById("club-seed").textContent);
var styleEl=document.createElement("style");styleEl.textContent=NDL.css;document.head.appendChild(styleEl);

/* ================= Хранилище: в браузере + файл ================= */
var KEY="noodome-invites-v1",canStore=true,DB=null;
try{var raw=localStorage.getItem(KEY);if(raw)DB=JSON.parse(raw);}catch(e){canStore=false;}
if(!DB||!DB.docs)DB={docs:{}};
/* Пример (Михаил) обновляется вместе с сервисом, если его не правили после прошлой версии. */
var oldSeed=DB.docs[SEED.slug];
if(!Object.keys(DB.docs).length||(oldSeed&&(oldSeed.seedVersion||1)<(SEED.seedVersion||1)))DB.docs[SEED.slug]=SEED;
/* Общие блоки клуба: при первом запуске и когда в сервис приходит новая версия общих блоков. */
if(!DB.club||(DB.clubVersion||0)<(CLUB_SEED.version||1)){DB.club=clubFromSeed();DB.clubVersion=CLUB_SEED.version||1;}
persist();
function clubFromSeed(){var o={};SHARED.forEach(function(k){o[k]=CLUB_SEED[k]?clone(CLUB_SEED[k]):TYPES[k].make();});return o;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));canStore=true;return true;}catch(e){canStore=false;return false;}}
function docs(){return Object.keys(DB.docs).map(function(k){return DB.docs[k];});}
function withClub(d){return Object.assign({},d,{club:DB.club});}

/* ================= Знания для Claude ================= */
var KNOW={
  communities:"Тематические сообщества: Шахматный клуб; Клуб игры го; Мафия; Про образование; Партнёрства и преемственность; Я и благотворительность; Развитие территорий; Культурный код; ESG; Kids & Family; Champagne Lovers; Lost in Translation (международная среда); NoôSailing; NoôFreediving; Music Lovers; Noôtravel (путешествия: Армения, Япония, Байкал, Бутан, Узбекистан); Важно! Не срочно; Люди. Организации. Лидеры; Well-Being Community; Семья и традиции; Книжный клуб Knigôdome; Попробуй спорт!; Психология бизнеса; Визионерство и новаторство; Talents; Третий звонок (театр).\nЛаборатории Noôlab: Бизнес и технологии; Креативные индустрии; Архитекторы будущего; Nextgen; Искусство и эстетика.\nФорматы: дискуссии, эногастрономические вечера, совместные путешествия, перформансы и концерты, кинопоказы, семейная программа, ежегодный круиз Noôboat, деловые завтраки.\nМеста: терраса «Тимирязев» с видом на Кремль, терраса «Романов», ресторан Noôcafe, амфитеатр, кинозал, библиотека, студии для встреч, сады Noôgarden.",
  tone:"Тон Noôdome: про людей и смыслы, а не про статус и сервис. Спокойная уверенность: без превосходных степеней, восклицательных знаков, срочности. На «вы» со строчной. Конкретные детали вместо общих слов.\nГоворим: сообщество, участники, единомышленники, неслучайные встречи, рекомендация, встреча-знакомство, делиться, вместе, проекты.\nНе говорим: элитный, VIP, премиум, эксклюзивное предложение, успейте, нетворкинг, полезные связи, статус, престиж, клиенты, прокачать.\nТексты от первого лица пишет человек, а не клуб: своя интонация, его собственные слова там, где возможно. Без перечня привилегий и цен.",
  club:"Noôdome — сообщество единомышленников и клубное пространство в центре Москвы (Романов переулок, 2), основано в 2020 году Рубеном Варданяном и Вероникой Зонабенд. Около 1000 участников, 26 амбассадоров, 800+ событий в год, 4000 м², три террасы. Ценности: доверие, интеграция разнообразия, социальная ответственность, преемственность, постоянное самообразование. Вступление: рекомендация участника → встреча-знакомство в пространстве и анкета → решение адмиссионного комитета → приглашение. Взносы вносятся только после решения комитета. Есть семейная программа, молодёжные условия для 18–29 лет."
};
var ANSWER="\n\nОтветь одним сообщением: только JSON, без пояснений до и после, без артефактов и файлов.";
var RULES="ПРАВИЛА ИЗВЛЕЧЕНИЯ\n1. Ничего не выдумывай. Каждое утверждение опирается на материалы. Нет данных — оставь поле пустым и добавь вопрос в gaps.\n2. Цитаты только дословные, без правок. Пересказ помечай как пересказ.\n3. Выбери 2–3 главные вещи о человеке: почему ему важен клуб и чем он интересен другим. Остальное перечисли в omit с причиной.\n4. Не выноси на страницу: финансы и выручку, здоровье, подробности о близких сверх нужного, политику, всё, что может смутить человека при публикации.\n5. Сопоставь темы человека с сообществами клуба из списка. Это вывод, помечай его как вывод.\n6. Пиши по-русски, коротко и конкретно.";
var TYPE_HINT={hero:"Имя и приглашение на однотонном фоне",why:"Один абзац и фото участника в клубе",letter:"Обращение от первого лица",list:"Темы, сообщества, причины",story:"Проект с фото и ссылкой",quote:"Яркая фраза человека",text:"Свободный текст",photo:"Снимок с подписью",figures:"Клуб в цифрах",faq:"Ответы на частые вопросы",
  about:"Общий блок: текст и фото с сайта",community:"Общий блок: цифры и амбассадоры",events:"Общий блок: афиша",steps:"Общий блок: путь от заявки до клуба",apply:"Общий блок: форма для кандидата"};
function blockSpec(){
  return Object.keys(TYPES).filter(function(k){return !TYPES[k].shared&&k!=="hero";}).map(function(k){
    var t=TYPES[k],f=t.fields.map(function(x){return x[0];}),it=t.items?" items:[{"+t.items.map(function(x){return x[0];}).join(", ")+"}]":"";
    return "- "+k+" ("+t.label+"): "+f.join(", ")+it;
  }).join("\n")+"\nПоля text и paragraphs — строка, абзацы через пустую строку. photo не заполняй.";
}
function createPrompt(src){
  return "Ты помогаешь команде клуба Noôdome готовить именные лендинги-приглашения от участников клуба (их называют Коннекторами). Лендинг читается на телефоне как личное приглашение от участника, а не как реклама. От участника к участнику меняются только три блока: «Для меня Noôdome», «Что мне здесь близко» и «Мой проект с Noôdome». Остальное (о клубе, сообщество, афиша, шаги, форма) общее, его писать не нужно. Материалы об участнике ниже: интервью, анкета, заметки или переписка.\n\nСделай два шага.\n\nШАГ 1. Извлеки профиль участника.\n"+RULES+
  "\n\nШАГ 2. По профилю напиши тексты от его лица.\n"+KNOW.tone+
  "\n- why: ОДИН абзац, 4–6 предложений от первого лица: что для него Noôdome и почему он здесь. Если в материалах он сам говорит о клубе, бери его слова почти дословно, только сокращай. Если не говорит — напиши по его ценностям и добавь вопрос в gaps.\n- mine: 2–3 пункта «что мне здесь близко». Если он сам называет любимое в клубе — пиши об этом. Если нет — пиши о его темах и честно добавляй «В клубе есть сообщество …», не утверждая, что он туда ходит.\n- story: его проект, связанный с Noôdome (сделан вместе с участниками клуба, вырос из встречи в клубе или о нём рассказывал клуб). Если такого нет — null. text: 2 коротких абзаца от первого лица, как он сам рассказал бы другу: что это, как появилось, что получилось. Никаких казённых оборотов вроде «клуб рассказывает о нём», «стал соорганизатором». quote: его дословная фраза о проекте или клубе, если есть. linkUrl: ссылка на страницу проекта, если она есть в материалах.\n- messenger: 2–3 предложения для Telegram от первого лица, в конце {ссылка}.\n- Никаких цен, привилегий и эксклюзивности.\n\nКЛУБ (только эти факты)\n"+KNOW.club+"\n\n"+KNOW.communities+
  "\n\nМАТЕРИАЛЫ\n\"\"\"\n"+String(src).slice(0,60000)+"\n\"\"\"\n\n"+
  'Формат ответа:\n{"profile":{"name":"Имя Фамилия","nameGenitive":"Имени Фамилии","signoff":"имя для подписи","role":"одна строка: кто он","since":"","themes":[""],"whyClub":{"text":"","kind":"цитата|пересказ|нет данных"},"credo":{"text":"","kind":"цитата|пересказ|нет данных"},"clubLove":[""],"clubMatches":[{"community":"","why":""}],"projects":[{"title":"","text":""}],"facts":[{"field":"","source":"цитата / пересказ / вывод и откуда"}],"gaps":["вопросы участнику"],"omit":["что не берём и почему"]},'+
  '"texts":{"why":"","role":"","mine":{"title":"Что мне здесь близко","intro":"","items":[{"label":"","text":""}]},"story":{"label":"Мой проект с Noôdome","title":"","text":"","quote":"","linkUrl":""},"messenger":"","facts":[{"field":"","source":""}]}}'+ANSWER;
}
function context(doc){
  return "УЧАСТНИК: "+doc.name+" ("+(doc.role||"")+")\nПРОФИЛЬ\n"+JSON.stringify(doc.profile||{},null,1)+(doc.source?"\n\nИСХОДНЫЕ МАТЕРИАЛЫ\n\"\"\"\n"+doc.source.slice(0,30000)+"\n\"\"\"":"")+
  "\n\nСЕЙЧАС НА СТРАНИЦЕ\n"+(doc.blocks||[]).map(function(b,i){var t=TYPES[b.type]||{};return (i+1)+". "+(t.label||b.type)+(t.shared?" (общий блок клуба)":"")+": "+summary(b);}).join("\n");
}
function newBlockPrompt(desc,doc){
  return "Добавь новый блок на именной лендинг-приглашение в клуб Noôdome. Блок должен продолжать страницу, а не повторять то, что уже есть.\n\nЗАПРОС КОМАНДЫ: "+desc+"\n\n"+KNOW.tone+"\n\nКЛУБ\n"+KNOW.club+"\n\n"+KNOW.communities+"\n\n"+context(doc)+
  "\n\nТИПЫ БЛОКОВ И ИХ ПОЛЯ\n"+blockSpec()+"\n\nПРАВИЛА\n- Выбери самый подходящий тип.\n- Факты о человеке бери только из профиля и материалов, факты о клубе только из раздела КЛУБ.\n- Если для запроса не хватает фактов, верни {\"error\":\"чего не хватает\"}.\n- Пиши коротко: заголовок до 8 слов, пункт до 3 предложений.\n\nФормат ответа: {\"type\":\"\",\"data\":{...}}"+ANSWER;
}
function rewritePrompt(b,instr,doc){
  var t=TYPES[b.type],d=JSON.parse(JSON.stringify(b.data||{}));delete d.photo;(d.items||[]).forEach(function(x){if(x)delete x.photo;});
  return "Перепиши один блок именного лендинга-приглашения в клуб Noôdome.\n\nЗАДАЧА: "+instr+"\n\n"+KNOW.tone+"\n\nКЛУБ\n"+KNOW.club+"\n\n"+context(doc)+
  "\n\nБЛОК («"+t.label+"», тип "+b.type+")\n"+JSON.stringify(d,null,1)+
  "\n\nПРАВИЛА\n- Сохрани тип и набор полей. Поле photo не возвращай. Плейсхолдеры {name}, {nameGenitive}, {signoff} можно оставлять.\n- Факты о человеке только из профиля и материалов.\n\nФормат ответа: {\"data\":{...}}"+ANSWER;
}
function parseJson(text){
  var t=String(text||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  try{return JSON.parse(t);}catch(e){}
  var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)return null;
  try{return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
}

/* ================= Утилиты ================= */
var S={q:"",filter:"all",ed:null,create:null};
var view=document.getElementById("view");
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>';}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},3200);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function arr(v){return Array.isArray(v)?v:v?[v]:[];}
function copy(text,msg){function fb(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);toast(ok?(msg||"Скопировано"):"Не удалось скопировать");}
  try{navigator.clipboard.writeText(text).then(function(){toast(msg||"Скопировано");},fb);}catch(e){fb();}}
function pill(s){return s==="approved"?'<span class="pill approved">Согласовано</span>':'<span class="pill draft">Черновик</span>';}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0);}).join("").toUpperCase();}
function when(iso){if(!iso)return "";var d=new Date(iso);if(isNaN(d))return "";var now=new Date(),diff=(now-d)/1000;if(diff<60)return "только что";if(diff<3600)return Math.floor(diff/60)+" мин назад";if(d.toDateString()===now.toDateString())return "сегодня в "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});}
function summary(b){var d=NDL.dataOf(b,{club:DB.club})||{};var s=b.type==="why"?(d.text||d.title):(d.title||d.quote||d.text||d.greeting||d.caption||(d.items&&d.items[0]&&(d.items[0].label||d.items[0].q||d.items[0].title))||"");s=Array.isArray(s)?s.join(" "):String(s);return s.replace(/\s+/g," ").slice(0,80);}
function resizePhoto(file,max){return new Promise(function(res,rej){var img=new Image();img.onload=function(){var s=Math.min(1,(max||720)/Math.max(img.width,img.height));var cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);res(cv.toDataURL("image/jpeg",0.82));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
function slugify(s){var m={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
  var o=String(s||"").toLowerCase().split("").map(function(c){return m[c]!=null?m[c]:c;}).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"connector";
  var base=o,i=2;while(DB.docs[o]){o=base+"-"+i;i++;}return o;}
function download(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function jsonSafe(v){return JSON.stringify(v).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");}
function msgText(d){return String(d.messenger||"Здравствуйте! Хочу пригласить вас в Noôdome, это сообщество, в котором я давно. Вот моё личное приглашение: {ссылка}");}

/* Запрос копируется в буфер, его вставляют в claude.ai, ответ вставляют обратно. API не нужен. */
var BR={};
function bridge(id,label,getPrompt,apply){
  BR[id]={get:getPrompt,apply:apply};
  return '<div class="ai bridge"><span class="lbl">'+ic("spark")+esc(label)+'</span>'+
    '<div class="row"><button class="btn sm primary" data-bcopy="'+id+'">'+ic("copy")+'1. Скопировать запрос</button><a class="btn sm" href="https://claude.ai/new" target="_blank" rel="noopener">'+ic("ext")+'2. Открыть Claude</a></div>'+
    '<textarea data-bans="'+id+'" placeholder="3. Вставьте сюда ответ Claude целиком" aria-label="Ответ Claude"></textarea>'+
    '<div class="row"><button class="btn sm dark" data-bapply="'+id+'">4. Применить</button><span class="err small" data-berr="'+id+'"></span></div></div>';
}
document.addEventListener("click",function(e){

/* ================= Чтение файлов ================= */
var scripts={};
function loadScript(src){if(!scripts[src])scripts[src]=new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){delete scripts[src];rej(new Error("script"));};document.head.appendChild(s);});return scripts[src];}
function decodeXml(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");}
function readFile(f){
  var n=f.name.toLowerCase();
  if(/\.docx$/.test(n))return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js").then(function(){return f.arrayBuffer();}).then(function(b){return window.JSZip.loadAsync(b);}).then(function(z){var x=z.file("word/document.xml");if(!x)throw new Error("docx");return x.async("string");}).then(function(x){
    return decodeXml(x.replace(/<w:tab\/>/g,"\t").replace(/<w:br[^>]*\/>/g,"\n").replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g,"")).replace(/\n{3,}/g,"\n\n").trim();});
  if(/\.pdf$/.test(n))return loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(function(){
    var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    return f.arrayBuffer().then(function(b){return lib.getDocument({data:new Uint8Array(b),isEvalSupported:false}).promise;}).then(function(pdf){
      var ps=[];for(var i=1;i<=Math.min(pdf.numPages,60);i++)ps.push(pdf.getPage(i).then(function(p){return p.getTextContent();}).then(function(tc){var out="",y=null;tc.items.forEach(function(it){var ny=it.transform[5];if(y!==null&&Math.abs(ny-y)>2)out+="\n";out+=it.str;y=ny;});return out;}));
      return Promise.all(ps).then(function(a){return a.join("\n\n").trim();});});});
  if(/\.rtf$/.test(n))return f.text().then(function(t){return t.replace(/\\par[d]?/g,"\n").replace(/\{\\\*[^{}]*\}|\\[a-z]+-?\d* ?|[{}]/g,"").trim();});
  if(/\.html?$/.test(n))return f.text().then(function(t){var d=new DOMParser().parseFromString(t,"text/html");return (d.body?d.body.textContent:"").replace(/\n\s*\n\s*\n+/g,"\n\n").trim();});
  if(/\.(doc|pages|odt)$/.test(n))return Promise.reject(new Error("format"));
  return f.text();
}

function bindEditor(){

  view.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){E.view=b.dataset.v;renderEditor();};});

  var dlb=document.getElementById("dlBtn");if(dlb)dlb.onclick=function(){download(fileName(d),standalone(d),"text/html");toast(d.status==="approved"?"Файл "+fileName(d)+" скачан":"Скачан черновик. Перед отправкой согласуйте текст с Коннектором");};
  var mb=document.getElementById("menuBtn");if(mb)mb.onclick=function(e){e.stopPropagation();E.menu=!E.menu;renderEditor();};
  view.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){E.menu=false;var m=b.dataset.m;
    if(m==="preview")openPreview(d);else if(m==="msg"){E.share=true;renderEditor();}
    else if(m==="json"){download(d.slug+".json",JSON.stringify(d),"application/json");renderEditor();}
    else if(m==="danger"){E.delAsk=true;renderEditor();window.scrollTo(0,0);}};});
  view.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var c=b.dataset.c;

    else if(c==="clubreset"){E.resetAsk=true;renderEditor();}else if(c==="resetno"){E.resetAsk=false;renderEditor();}
    else if(c==="resetyes"){DB.club=clubFromSeed();DB.clubVersion=CLUB_SEED.version||1;persist();S.ed=null;openClub();toast("Общие блоки возвращены к исходным");}else if(c==="delyes"){delete DB.docs[d.slug];persist();S.ed=null;toast("Приглашение удалено");go("invites");}};});

    if(el.dataset.endpoint){DB.settings=DB.settings||{};DB.settings.endpoint=v.trim();persist();return;}
    if(el.dataset.doc){d[el.dataset.doc]=v;changed(false);return;}
    var bid=el.dataset.b;if(!bid)return;var b=d.blocks[findB(bid)];if(!b)return;
    if(el.dataset.ik!=null)b.data.items[+el.dataset.i][el.dataset.ik]=v;
    else if(el.dataset.k)b.data[el.dataset.k]=el.dataset.paras?v.split(/\n\s*\n/):v;
    var sm=document.querySelector('[data-card="'+bid+'"] .blk-h small');if(sm)sm.textContent=NDL.sub(summary(b),d)||"Пусто";
    changed(false);
  });
  root.addEventListener("change",function(e){
    var el=e.target;

    if(el.dataset.iphoto&&el.files&&el.files[0]){resizePhoto(el.files[0],640).then(function(u){var b=d.blocks[findB(el.dataset.iphoto)];b.data.items[+el.dataset.i][el.dataset.ik]=u;changed(true);},function(){toast("Не удалось прочитать фото");});}

    if(ds.open!=null){if(e.target.closest(".tools"))return;E.sel=E.sel===ds.open?null:ds.open;renderEditor();return;}
    if(ds.additem){var b=d.blocks[findB(ds.additem)],o={};TYPES[b.type].items.forEach(function(f){o[f[0]]="";});b.data.items=(b.data.items||[]).concat([o]);changed(true);return;}

    if(ds.rmphoto){var b3=d.blocks[findB(ds.rmphoto)];if(TYPES[b3.type].docPhoto){d.photo="";b3.data.photo="";}else b3.data.photo="";changed(true);return;}
    if(ds.rmiphoto){d.blocks[findB(ds.rmiphoto)].data.items[+ds.i][ds.ik]="";changed(true);return;}
    if(ds.upitem){var it=d.blocks[findB(ds.upitem)].data.items,q=+ds.i,tmp=it[q-1];it[q-1]=it[q];it[q]=tmp;changed(true);return;}
    if(ds.rmdocphoto){d.photo="";changed(true);return;}
    if(ds.addtype){var nb=NDL.block(ds.addtype);d.blocks.splice(insertAt(),0,nb);E.sel=nb.id;E.add=null;changed(true);return;}
    if(t.id==="addOpen"){E.add={desc:""};renderEditor();return;}
    if(t.id==="addClose"){E.add=null;renderEditor();return;}
  });

/* ================= Сохранить всё / открыть ================= */
document.getElementById("exportAll").onclick=function(e){e.preventDefault();download("noodome-priglasheniya-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({kind:"noodome-invites",docs:DB.docs,club:DB.club,clubVersion:DB.clubVersion}),"application/json");toast("Файл со всеми приглашениями скачан");};
document.getElementById("importAll").onclick=function(e){e.preventDefault();document.getElementById("importFile").click();};
document.getElementById("importFile").onchange=function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(t){
  var j=JSON.parse(t),list=j.docs?Object.keys(j.docs).map(function(k){return j.docs[k];}):[j],n=0;
  list.forEach(function(d){if(d&&d.slug&&d.name&&Array.isArray(d.blocks)){DB.docs[d.slug]=d;n++;}});
  if(j.club&&typeof j.club==="object"){DB.club=Object.assign(clubFromSeed(),j.club);DB.clubVersion=j.clubVersion||DB.clubVersion;n=n||1;}
  if(!n)throw new Error("empty");S.ed=null;persist();toast("Открыто приглашений: "+n);go("invites");
}).catch(function(){toast("Это не файл приглашений Noôdome");});e.target.value="";};

window.NDApp={DB:DB,withClub:withClub,standalone:function(s){return standalone(DB.docs[s]);},createPrompt:createPrompt};
route();
})();
